<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sinemata</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-[#14181C]">
    <!-- Navbar -->
    <nav class="bg-[#1C2127] py-5 px-8">
      <!-- Link Brand -->
      <div class="container flex items-center gap-27.5 max-w-[1300px] mx-auto">
        <a href="#" class="text-3xl text-[#E4E7EB] font-bebas"> SINEMATA </a>

        <!-- Navigations -->
        <div class="text-[#9CA3AF] flex gap-6 font-inter">
          <a href="#" class="hover:text-white">Home</a>
          <a href="#" class="hover:text-white">Browse</a>
          <a href="#" class="hover:text-white">Watchlist</a>
          <a href="#" class="hover:text-white">My Reviews</a>
        </div>
      </div>
    </nav>
    <!-- Section Trending Movies -->

    <!-- Hero Section -->
    <div
      id="hero"
      class="container relative max-w-[1300px] mx-auto mt-4 bg-linear-to-bl from-[#2A1810] to-[#0F1419] rounded-xl p-[50px]"
    >
      <div class="content max-w-[40%] flex flex-col items-start">
        <!-- badge -->
        <span
          class="font-inter text-sm font-bold text-[#FF8000] bg-[#FF8000]/18 border border-[FF8000]/40 rounded-[3px] py-[5px] px-[10px]"
          >FEATURED THIS WEEK</span
        >
        <!-- heading -->
        <h1
          class="font-bebas text-[60px] text-white max-w-[70%] leading-none my-4"
        >
          CHRONOS LETTERBOUND
        </h1>
        <!-- span -->
        <div class="font-inter text-sm flex gap-x-3">
          <span class="text-[#FBBF24]">★ 8.7</span>
          <span class="text-[#9CA3AF]">2024 · 2h 18m · Sci-Fi · Drama</span>
        </div>
        <!-- paragraph -->
        <p class="font-inter text-sm text-[#CBD5DB] my-5">
          Seorang penjaga arsip menemukan surat-surat dari masa depan yang
          ditulis untuknya — masing-masing meminta keputusan mustahil.
        </p>
        <!-- buttons -->
        <div class="flex gap-x-3">
          <button
            class="py-3 px-7 bg-[#FF8000] text-[#14181C] font-inter font-bold rounded cursor-pointer hover:bg-[#FF7000]"
          >
            ▶ Lihat Detail
          </button>
          <button
            class="py-3 px-7 bg-[#3A4049] text-white font-inter font-bold rounded cursor-pointer hover:bg-[#3A4049]"
          >
            + Watchlist
          </button>
        </div>
      </div>

      <div class="img">
        <img src="./cards.png" alt="cards" / class="absolute top-[50px] right-[60px]">
      </div>
    </div>

    <!-- Trending Section -->
    <section id="trending" class="container max-w-[1300px] mx-auto mt-12">
      <!-- Heading -->
      <div class="heading flex items-center gap-x-3">
        <div class="orange-bar bg-[#FF8000] w-1 h-6.5"></div>
        <h2 class="heading-text text-white font-bebas text-3xl">
          TRENDING NOW
        </h2>
      </div>
      <!-- Grid -->
      <div class="card-container flex gap-x-3 mt-8 max-w-[1300px] overflow-x-hidden">
        
      </div>
    </section>

    <footer class="mt-50"></footer>

    <script src="./js/script.js"></script>
    <script src="./js/movie.js"></script>
  </body>
</html>
